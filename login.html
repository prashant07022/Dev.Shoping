<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dev.Shoping</title>
    <style>
.front{

            margin: 0;
            min-height: 98.5svh;
            display: flex;
            place-items: center;
            background: linear-gradient(160deg, #dbeafe, #e9d5ff 60%, #ffe4e6);
            font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, "Noto Sans", "Apple Color Emoji", "Segoe UI Emoji";
            position: fixed;
            inset: 0;
            justify-content: center;
            align-items: center;
            z-index: 9999;
}
.front-h1{
    text-align: center;
    font-family: "Times New Roman", Times, serif;
}
.logo{
    text-align: center;
    font-size: 30px;
}
.search-box{
    text-align: center;
}
.icon{
    text-align: center;
}
.login{
    font-family: sans-serif; background: #fafafa; display: none; justify-content: center; align-items: center; height: 100vh; margin: 0;
}
.box { 
    background: #fff; border: 1px solid #dbdbdb; padding: 40px 35px; width: 300px; text-align: center; border-radius: 4px; 
}
.h1 { 
    font-family: cursive; font-size: 40px; margin: 0 0 25px; 
}
input { width: 100%; padding: 9px; margin: 5px 0; border: 1px solid #dbdbdb; border-radius: 3px; background: #fafafa; font-size: 13px; box-sizing: border-box; }
button { width: 100%; padding: 8px; margin-top: 10px; background: #4db5ff; color: #fff; border: none; border-radius: 5px; font-weight: bold; cursor: pointer; }
button:disabled { opacity: 0.6; cursor: not-allowed; }
.forgot { display: block; margin-top: 15px; font-size: 12px; color: #00376b; text-decoration: none; }
.signup { margin-top: 15px; font-size: 13px; }
.signup a { color: #ff6b35; text-decoration: none; font-weight: bold; }

    </style>
    <body>
<section class="front">
    <div class="front-h1">
        <h1>Dev.Shoping</h1>
    </div>
</section>
<section class="login">
<div class="box">
    
  <h1>Dev.Shoping</h1>
  
  <form id="loginForm">
    <input type="text" id="username" placeholder="Username or email" required>
    <input type="password" id="password" placeholder="Password" required>
    <button type="submit" id="loginBtn" disabled>Log in</button>
  </form>
  <a href="#" class="forgot">Forgot password?</a>
  <div class="signup">Don't have an account? <a href="#">Sign up</a></div>
</div>

</section>
<script>
setTimeout(function() {
    document.querySelector(".front").style.display="none";
    document.querySelector(".login").style.display="flex";
},2500);
  const user = document.getElementById('username');
  const pass = document.getElementById('password');
  const btn = document.getElementById('loginBtn');

  function check() { btn.disabled = !(user.value && pass.value); }
  user.oninput = check;
  pass.oninput = check;

  document.getElementById('loginForm').onsubmit = e => {
    e.preventDefault();
    window.location.href="shoping.html";
  };
</script>
    </body>
</head>
